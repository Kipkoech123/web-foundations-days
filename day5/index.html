<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { margin-top: 0; }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .field { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
    label { font-weight: 600; margin-bottom: 0.25rem; }
    input {
      padding: 0.55rem 0.75rem;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    button {
      padding: 0.6rem 1rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { min-height: 1.5rem; color: #475569; }
    #status.error { color: #dc2626; font-weight: 600; }
    #users-list { list-style: none; margin: 0; padding: 0; }
    #users-list li {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.75rem;
    }
    #users-list h2 { margin: 0 0 0.35rem; font-size: 1.1rem; }
    #users-list p { margin: 0.1rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>User Directory</h1>

    <div class="controls">
      <button id="load-users" type="button">Load users</button>
      <div class="field">
        <label for="filter-input">Filter by name</label>
        <input type="text" id="filter-input" placeholder="Type a name...">
      </div>
    </div>

    <p id="status"></p>
    <ul id="users-list"></ul>
  </main>
</body>
</html>
